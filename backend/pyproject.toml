[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GinoTaipe", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.2.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyodbc>=5.5.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
