@if (mostrarSesion()) {
  @if (auth.estaAutenticado()) {
    <nav class="navbar navbar-expand-lg navbar-dark av-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/inicio">
          <span class="brand-mark">♻</span><span>ALERTA <strong>VERDE</strong></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAlerta" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuAlerta">
          <div class="navbar-nav ms-lg-4 me-auto">
            <a class="nav-link" routerLink="/inicio" routerLinkActive="active">Inicio</a>
            <a class="nav-link" routerLink="/reportes" routerLinkActive="active">Consultar reportes</a>
            <a class="nav-link" routerLink="/reportes/nuevo" routerLinkActive="active">Crear reporte</a>
          </div>
          <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
            <span class="user-pill">● {{ auth.usuarioActual() }}</span>
            <button class="btn btn-light btn-sm rounded-pill px-3" type="button" (click)="cerrarSesion()">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>
  } @else {
    <nav class="navbar navbar-expand navbar-dark av-navbar">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/login"><span class="brand-mark">♻</span> ALERTA <strong>VERDE</strong></a>
        <div class="navbar-nav ms-auto flex-row gap-3">
          <a class="nav-link" routerLink="/login">Iniciar sesión</a>
          <a class="nav-link" routerLink="/registro">Crear cuenta</a>
        </div>
      </div>
    </nav>
  }
}
<main>
  <router-outlet />
</main>
<footer class="av-footer">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>© 2026 Alerta Verde · Comunidad que cuida su entorno</span>
    <span>Reporta. Participa. Transforma. 🌱</span>
  </div>
</footer>
